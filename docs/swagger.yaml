openapi: 3.0.0
info:
  title: TV Shows API
  description: |
    API for querying TV shows dataset.
    
    ## Features
    - Health check endpoint
    - Retrieve all TV shows
    - Filter shows by genre
    
    ## Base URL
    Production: `https://tcss-460-group-7-tv-shows-dataset-api-g4kq.onrender.com`
    
  version: 1.0.0
  contact:
    name: TCSS 460 Group 7

servers:
  - url: https://tcss-460-group-7-tv-shows-dataset-api-g4kq.onrender.com
    description: Production server (Render)
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: API health check
  - name: TV Shows
    description: Operations for retrieving TV show information

paths:
  /health:
    get:
      summary: Health check
      description: Check if the API is running and healthy
      tags:
        - Health
      responses:
        '200':
          description: API is healthy and running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  message:
                    type: string
                    example: "API is running"
              examples:
                success:
                  value:
                    status: "healthy"
                    message: "API is running"

  /api/shows:
    get:
      summary: Get all TV shows
      description: |
        Retrieves all TV shows from the database.
        
        Returns a list of TV shows with their details including name, genre, rating, and more.
      tags:
        - TV Shows
      responses:
        '200':
          description: Successfully retrieved TV shows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TVShow'
              examples:
                success:
                  value:
                    - id: 1
                      name: "Breaking Bad"
                      original_name: "Breaking Bad"
                      first_air_date: "2008-01-20"
                      last_air_date: "2013-09-29"
                      seasons: 5
                      episodes: 62
                      status: "Ended"
                      genres: "Drama, Crime, Thriller"
                      overview: "A high school chemistry teacher turned methamphetamine producer"
                      popularity: 234.5
                      tmdb_rating: 9.3
                      vote_count: 15234
                    - id: 2
                      name: "Game of Thrones"
                      original_name: "Game of Thrones"
                      first_air_date: "2011-04-17"
                      last_air_date: "2019-05-19"
                      seasons: 8
                      episodes: 73
                      status: "Ended"
                      genres: "Drama, Fantasy, Adventure"
                      overview: "Nine noble families fight for control of the lands of Westeros"
                      popularity: 456.7
                      tmdb_rating: 9.2
                      vote_count: 28456
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/shows/by-genre/{genre}:
    get:
      summary: Filter TV shows by genre
      description: |
        Retrieves TV shows filtered by a specific genre.
        
        **Example genres:** Drama, Comedy, Action, Sci-Fi, Horror, Thriller, Romance
      tags:
        - TV Shows
      parameters:
        - in: path
          name: genre
          required: true
          schema:
            type: string
          description: The genre to filter by (case-sensitive)
          example: "Drama"
      responses:
        '200':
          description: Successfully retrieved TV shows for the specified genre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TVShow'
              examples:
                drama:
                  value:
                    - id: 1
                      name: "Breaking Bad"
                      original_name: "Breaking Bad"
                      first_air_date: "2008-01-20"
                      last_air_date: "2013-09-29"
                      seasons: 5
                      episodes: 62
                      status: "Ended"
                      genres: "Drama, Crime, Thriller"
                      overview: "A high school chemistry teacher turned methamphetamine producer"
                      popularity: 234.5
                      tmdb_rating: 9.3
                      vote_count: 15234
                    - id: 3
                      name: "The Wire"
                      original_name: "The Wire"
                      first_air_date: "2002-06-02"
                      last_air_date: "2008-03-09"
                      seasons: 5
                      episodes: 60
                      status: "Ended"
                      genres: "Drama, Crime"
                      overview: "The Baltimore drug scene as seen through the eyes of drug dealers and law enforcement"
                      popularity: 123.4
                      tmdb_rating: 9.3
                      vote_count: 8765
        '404':
          description: No shows found for the specified genre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    TVShow:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the TV show
          example: 1
        name:
          type: string
          description: Current name of the TV show
          example: "Breaking Bad"
        original_name:
          type: string
          description: Original name of the TV show
          example: "Breaking Bad"
        first_air_date:
          type: string
          format: date
          description: Date when the show first aired
          example: "2008-01-20"
        last_air_date:
          type: string
          format: date
          description: Date of the last aired episode
          example: "2013-09-29"
        seasons:
          type: integer
          description: Total number of seasons
          example: 5
        episodes:
          type: integer
          description: Total number of episodes
          example: 62
        status:
          type: string
          description: Current status of the show
          example: "Ended"
        genres:
          type: string
          description: Comma-separated list of genres
          example: "Drama, Crime, Thriller"
        overview:
          type: string
          description: Brief description of the show
          example: "A high school chemistry teacher diagnosed with cancer turns to cooking meth."
        popularity:
          type: number
          format: float
          description: Popularity score from TMDB
          example: 234.567
        tmdb_rating:
          type: number
          format: float
          description: Rating from The Movie Database
          example: 9.3
        vote_count:
          type: integer
          description: Number of votes on TMDB
          example: 15234

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Genre not found"
        message:
          type: string
          description: Detailed error description
          example: "No TV shows found for the specified genre"
