openapi: 3.0.3
info:
  title: TV Show API
  description: |
    A comprehensive API for managing TV shows, including shows, actors, networks, studios, and creators.
    All endpoints require API key authentication.

  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: https://tcss-460-group-7-tv-shows-dataset-api-g4kq.onrender.com
    description: Production server
  - url: http://localhost:3000
    description: Development server

security:
  - ApiKeyAuth: []

tags:
  - name: Health
    description: Service health check
  - name: Shows
    description: TV show management
  - name: Metadata
    description: Genres, networks, statuses, studios, and other metadata
  - name: People
    description: Actors and creators
  - name: Images
    description: Show images and media

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Check API health
      description: Returns the health status of the API service and database connection
      operationId: getHealth
      responses:
        '200':
          description: Health status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                    example: ok
                  db:
                    type: string
                    enum: [ok, down]
                    example: ok
                  uptime:
                    type: number
                    format: float
                    description: Server uptime in seconds
                    example: 3456.78

  /api/shows:
    get:
      tags:
        - Shows
      summary: Search and filter TV shows
      description: |
        Advanced search with filters, pagination, and sorting capabilities.
        
        **Filter Logic:**
        - Use `match=all` (default) to require all specified filters to match
        - Use `match=any` to return shows matching any of the specified filters
        
        **Supported Filters:**
        - Text search (`q`) - searches in show name and original name
        - Genre filtering by name (comma-separated)
        - Network filtering by name (comma-separated, case-insensitive)
        - Studio filtering by name (comma-separated, case-insensitive)
        - Actor filtering by name (comma-separated, case-insensitive)
        - Status filtering (exact match)
        - Rating range filtering (min/max, clamped between 0-10)
      operationId: getShows
      parameters:
        - name: q
          in: query
          description: Search query (matches name or original_name)
          schema:
            type: string
          example: Breaking Bad
        - name: genre
          in: query
          description: Filter by genre name(s), comma-separated
          schema:
            type: string
          example: Drama,Crime
        - name: network
          in: query
          description: Filter by network name(s), comma-separated
          schema:
            type: string
          example: AMC
        - name: studio
          in: query
          description: Filter by studio name(s), comma-separated
          schema:
            type: string
          example: Sony Pictures Television
        - name: actor
          in: query
          description: Filter by actor name(s), comma-separated
          schema:
            type: string
          example: Bryan Cranston
        - name: status
          in: query
          description: Filter by status (exact match)
          schema:
            type: string
          example: Ended
        - name: rating_min
          in: query
          description: Minimum TMDB rating (0-10, automatically clamped)
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 10
          example: 7.5
        - name: rating_max
          in: query
          description: Maximum TMDB rating (0-10, automatically clamped)
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 10
          example: 9.5
        - name: match
          in: query
          description: Match logic for filters
          schema:
            type: string
            enum: [all, any]
            default: all
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Results per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum: [id, title, popularity, rating, first_air_date, last_air_date, episodes]
            default: id
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Shows retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShowSummary'
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    example: 150

    post:
      tags:
        - Shows
      summary: Create a new TV show
      description: Create a new TV show entry in the database
      operationId: createShow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShowRequest'
      responses:
        '201':
          description: Show created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: TV show created successfully
                  data:
                    $ref: '#/components/schemas/Show'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/shows/{id}:
    get:
      tags:
        - Shows
      summary: Get show by ID
      description: Retrieve detailed information about a specific TV show
      operationId: getShowById
      parameters:
        - name: id
          in: path
          required: true
          description: The show ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Show retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ShowDetail'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Shows
      summary: Update a TV show
      description: |
        Update a TV show's scalar fields and/or manage its relationships (genres, actors, studios, networks, creators).
        
        **Scalar Fields:** All optional. Provide only the fields you want to update.
        
        **Relationship Management:**
        - For each relationship type, provide an array of objects with `operation` ("add" or "remove")
        - **Genres:** Provide `name` and `operation`
        - **Actors:** Provide `id`, `character_name`, and `operation`
        - **Studios/Networks/Creators:** Provide `id` and `operation`
        
        At least one scalar field or one relationship operation must be provided.
        
        **Example Request Body:**
        ```json
        {
          "tmdb_rating": 9.5,
          "genres": [
            { "name": "Thriller", "operation": "add" }
          ],
          "actors": [
            { "id": 123, "character_name": "New Character", "operation": "add" },
            { "id": 456, "character_name": "Old Character", "operation": "remove" }
          ]
        }
        ```
      operationId: updateShow
      parameters:
        - name: id
          in: path
          required: true
          description: The show ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShowRequest'
      responses:
        '200':
          description: Show updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Show'
                  message:
                    type: string
                    example: Show updated successfully
                  notes:
                    type: array
                    items:
                      type: string
                    description: Optional notes about relationship operations (e.g., duplicates skipped)
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'


    delete:
      tags:
        - Shows
      summary: Delete a TV show
      description: Delete a TV show from the database
      operationId: deleteShow
      parameters:
        - name: id
          in: path
          required: true
          description: The show ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Show deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Show deleted successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

