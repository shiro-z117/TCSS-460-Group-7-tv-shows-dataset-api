components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  schemas:
    Show:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Breaking Bad
        original_name:
          type: string
          example: Breaking Bad
        first_air_date:
          type: string
          format: date-time
          example: 2008-01-20T00:00:00.000Z
        last_air_date:
          type: string
          format: date-time
          example: 2013-09-29T00:00:00.000Z
        seasons:
          type: integer
          example: 5
        episodes:
          type: integer
          example: 62
        status:
          type: string
          example: Ended
        overview:
          type: string
          nullable: true
          example: A high school chemistry teacher diagnosed with cancer...
        popularity:
          type: number
          format: float
          nullable: true
          example: 489.234
        tmdb_rating:
          type: number
          format: float
          nullable: true
          example: 8.9
        vote_count:
          type: integer
          nullable: true
          example: 12543
        poster_url:
          type: string
          nullable: true
          example: https://example.com/poster.jpg
        backdrop_url:
          type: string
          nullable: true
          example: https://example.com/backdrop.jpg

    ShowSummary:
      allOf:
        - $ref: '#/components/schemas/Show'
        - type: object
          properties:
            genres:
              type: array
              items:
                type: string
              example: [Drama, Crime, Thriller]

    ShowDetail:
      allOf:
        - $ref: '#/components/schemas/Show'
        - type: object
          properties:
            genres:
              type: array
              items:
                $ref: '#/components/schemas/Genre'
            networks:
              type: array
              items:
                $ref: '#/components/schemas/Network'
            studios:
              type: array
              items:
                $ref: '#/components/schemas/Studio'
            creators:
              type: array
              items:
                $ref: '#/components/schemas/Creator'
            cast:
              type: array
              items:
                $ref: '#/components/schemas/CastMember'

    CreateShowRequest:
      type: object
      required:
        - name
        - original_name
        - first_air_date
        - last_air_date
        - seasons
        - episodes
        - status
        - genres
      properties:
        name:
          type: string
          example: Breaking Bad
        original_name:
          type: string
          example: Breaking Bad
        first_air_date:
          type: string
          format: date
          example: 2008-01-20
        last_air_date:
          type: string
          format: date
          example: 2013-09-29
        seasons:
          type: integer
          minimum: 1
          example: 5
        episodes:
          type: integer
          minimum: 1
          example: 62
        status:
          type: string
          example: Ended
        overview:
          type: string
          nullable: true
          example: A high school chemistry teacher diagnosed with cancer...
        popularity:
          type: number
          format: float
          minimum: 0
          nullable: true
          example: 489.234
        tmdb_rating:
          type: number
          format: float
          minimum: 0
          maximum: 10
          nullable: true
          example: 8.9
        vote_count:
          type: integer
          minimum: 0
          nullable: true
          example: 12543
        poster_url:
          type: string
          nullable: true
          example: https://example.com/poster.jpg
        backdrop_url:
          type: string
          nullable: true
          example: https://example.com/backdrop.jpg
        genres:
          type: array
          minItems: 1
          items:
            type: string
          example: [Drama, Crime, Thriller]
        actors:
          type: array
          maxItems: 10
          nullable: true
          items:
            oneOf:
              - type: object
                required:
                  - id
                  - character_name
                properties:
                  id:
                    type: integer
                    example: 17
                  character_name:
                    type: string
                    example: Walter White
              - type: object
                required:
                  - actor_name
                  - character_name
                properties:
                  actor_name:
                    type: string
                    example: Aaron Paul
                  character_name:
                    type: string
                    example: Jesse Pinkman
                  profile_url:
                    type: string
                    nullable: true
                    example: https://example.com/aaron-paul.jpg
        networks:
          type: array
          maxItems: 5
          nullable: true
          items:
            oneOf:
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: integer
                    example: 174
              - type: object
                required:
                  - network_name
                properties:
                  network_name:
                    type: string
                    example: AMC+
                  logo_url:
                    type: string
                    nullable: true
                    example: https://example.com/amc-plus-logo.png
                  country:
                    type: string
                    nullable: true
                    example: US
        studios:
          type: array
          maxItems: 5
          nullable: true
          items:
            oneOf:
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: integer
                    example: 3
              - type: object
                required:
                  - studio_name
                properties:
                  studio_name:
                    type: string
                    example: Sony Pictures Television
                  logo_url:
                    type: string
                    nullable: true
                    example: https://example.com/sony-logo.png
                  country:
                    type: string
                    nullable: true
                    example: US
        creators:
          type: array
          maxItems: 5
          nullable: true
          items:
            oneOf:
              - type: object
                required:
                  - id
                properties:
                  id:
                    type: integer
                    example: 1
              - type: object
                required:
                  - creator_name
                properties:
                  creator_name:
                    type: string
                    example: Peter Gould

    UpdateShowRequest:
      type: object
      properties:
        name:
          type: string
          example: Breaking Bad
        original_name:
          type: string
          example: Breaking Bad
        first_air_date:
          type: string
          format: date
          example: 2008-01-20
        last_air_date:
          type: string
          format: date
          example: 2013-09-29
        seasons:
          type: integer
          minimum: 0
          example: 5
        episodes:
          type: integer
          minimum: 0
          example: 62
        status:
          type: string
          example: Ended
        overview:
          type: string
          example: Updated overview...
        popularity:
          type: number
          format: float
          minimum: 0
          example: 500.0
        tmdb_rating:
          type: number
          format: float
          minimum: 0
          maximum: 10
          example: 9.0
        vote_count:
          type: integer
          minimum: 0
          example: 15000
        poster_url:
          type: string
          example: https://example.com/new-poster.jpg
        backdrop_url:
          type: string
          example: https://example.com/new-backdrop.jpg

    Genre:
      type: object
      properties:
        id:
          type: integer
          example: 18
        genre_name:
          type: string
          example: Drama

    Network:
      type: object
      properties:
        id:
          type: integer
          example: 174
        network_name:
          type: string
          example: AMC
        logo_url:
          type: string
          nullable: true
          example: https://example.com/amc-logo.png
        country:
          type: string
          nullable: true
          example: US

    Status:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Returning Series

    Studio:
      type: object
      properties:
        id:
          type: integer
          example: 3
        studio_name:
          type: string
          example: Sony Pictures Television
        logo_url:
          type: string
          nullable: true
          example: https://example.com/sony-logo.png
        country:
          type: string
          nullable: true
          example: US

    Actor:
      type: object
      properties:
        id:
          type: integer
          example: 17
        actor_name:
          type: string
          example: Bryan Cranston
        profile_url:
          type: string
          nullable: true
          example: https://example.com/bryan-cranston.jpg

    Creator:
      type: object
      properties:
        id:
          type: integer
          example: 1
        creator_name:
          type: string
          example: Vince Gilligan

    CastMember:
      type: object
      properties:
        actor_id:
          type: integer
          example: 17
        actor_name:
          type: string
          example: Bryan Cranston
        character_name:
          type: string
          example: Walter White
        profile_url:
          type: string
          nullable: true
          example: https://example.com/bryan-cranston.jpg

    Image:
      type: object
      properties:
        id:
          type: integer
          example: 1
        tv_show_id:
          type: integer
          example: 1
        image_url:
          type: string
          example: https://example.com/image1.jpg
        type:
          type: string
          enum: [poster, backdrop]
          example: poster
        width:
          type: integer
          nullable: true
          example: 1000
        height:
          type: integer
          nullable: true
          example: 1500
        language:
          type: string
          nullable: true
          example: en

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: field
              msg:
                type: string
                example: Name is required
              path:
                type: string
                example: name
              location:
                type: string
                example: body

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Show not found

    InvalidId:
      description: Invalid ID parameter
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Invalid show ID
