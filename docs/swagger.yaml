components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required for all endpoints

  schemas:
    TVShow:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the TV show
          example: 1
        name:
          type: string
          description: Current name of the TV show
          example: "Breaking Bad"
        original_name:
          type: string
          description: Original name of the TV show
          example: "Breaking Bad"
        first_air_date:
          type: string
          format: date
          description: Date of the first episode
          example: "2008-01-20"
        last_air_date:
          type: string
          format: date
          description: Date of the last episode
          example: "2013-09-29"
        seasons:
          type: integer
          description: Number of seasons
          example: 5
        episodes:
          type: integer
          description: Total number of episodes
          example: 62
        status:
          type: string
          description: Current status of the TV show
          enum: [Ended, Returning Series, Canceled, In Production, Planned]
          example: "Ended"
        genres:
          type: string
          description: Comma-separated list of genres
          example: "Drama, Crime, Thriller"
        overview:
          type: string
          description: Brief description or synopsis of the TV show
          example: "A high school chemistry teacher turned methamphetamine manufacturer"
        popularity:
          type: number
          format: float
          description: Popularity score
          example: 345.678
        tmdb_rating:
          type: number
          format: float
          description: TMDb rating score
          example: 8.9
        vote_count:
          type: integer
          description: Number of votes
          example: 12543

    TVShowInput:
      type: object
      required:
        - name
        - first_air_date
        - status
      properties:
        name:
          type: string
          description: Current name of the TV show
          example: "Better Call Saul"
        original_name:
          type: string
          description: Original name of the TV show
          example: "Better Call Saul"
        first_air_date:
          type: string
          format: date
          description: Date of the first episode
          example: "2015-02-08"
        last_air_date:
          type: string
          format: date
          description: Date of the last episode (optional)
          example: "2022-08-15"
        seasons:
          type: integer
          description: Number of seasons
          example: 6
        episodes:
          type: integer
          description: Total number of episodes
          example: 63
        status:
          type: string
          description: Current status of the TV show
          enum: [Ended, Returning Series, Canceled, In Production, Planned]
          example: "Ended"
        genres:
          type: string
          description: Comma-separated list of genres
          example: "Drama, Crime"
        overview:
          type: string
          description: Brief description or synopsis of the TV show
          example: "The trials and tribulations of criminal lawyer Jimmy McGill"
        popularity:
          type: number
          format: float
          description: Popularity score
          example: 234.567
        tmdb_rating:
          type: number
          format: float
          description: TMDb rating score
          example: 8.7
        vote_count:
          type: integer
          description: Number of votes
          example: 8432

    Image:
      type: object
      properties:
        id:
          type: integer
          description: Unique image ID
          example: 1
        type:
          type: string
          enum: [poster, backdrop, logo]
          description: Type of image
          example: "poster"
        url:
          type: string
          description: Image URL
          example: "https://image.tmdb.org/t/p/original/poster.jpg"
        width:
          type: integer
          description: Image width in pixels
          example: 1920
        height:
          type: integer
          description: Image height in pixels
          example: 1080

    CastMember:
      type: object
      properties:
        id:
          type: integer
          description: Unique cast member ID
          example: 1
        person_name:
          type: string
          description: Actor's name
          example: "Bryan Cranston"
        character:
          type: string
          description: Character name
          example: "Walter White"
        order:
          type: integer
          description: Billing order
          example: 1
        profile_url:
          type: string
          description: Actor's profile image URL
          example: "https://image.tmdb.org/t/p/original/actor.jpg"

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        total_pages:
          type: integer
          example: 50
        total_items:
          type: integer
          example: 1000
        items_per_page:
          type: integer
          example: 20

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
          example: "Invalid request parameters"

  responses:
    BadRequestError:
      description: Bad request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: "Invalid request parameters"
    
    UnauthorizedError:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: "Invalid or missing API key"
    
    ForbiddenError:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: "Insufficient permissions"
    
    NotFoundError:
      description: Not found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: "Resource not found"
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: "Internal server error"
